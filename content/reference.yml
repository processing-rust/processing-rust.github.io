- slug: curvePoint
  name: curvePoint()
  cat_tag: Shape / Curves
  description: Evaluates the Catmull-Rom curve at parameter t.
  related:
  - curve
  - curveTangent
  syntax: 'curve_point(a, b, c, d, t)


    // the engine function:

    fn curve_point(a: f32, b: f32, c: f32, d: f32, t: f32) -> f32'
  params:
  - name: a
    type: f32
    desc: coordinate of first control point
  - name: b
    type: f32
    desc: coordinate of first point
  - name: c
    type: f32
    desc: coordinate of second point
  - name: d
    type: f32
    desc: coordinate of second control point
  - name: t
    type: f32
    desc: value between 0 and 1
  returns: f32
  uth:
  - - src/lib.rs
    - "pub fn curve_point(a: f32, b: f32, c: f32, d: f32, t: f32) -> f32 {\n    let m = curve_basis();\n    let tv = [t * t * t, t * t, t, 1.0];\n    let p = [a, b, c, d];\n    (0..4).map(|j| (0..4).map(|i| tv[i] * m[i][j]).sum::<f32>() * p[j]).sum()\n}"
- slug: curveTangent
  name: curveTangent()
  cat_tag: Shape / Curves
  description: Calculates the tangent of a point on a Catmull-Rom curve.
  related:
  - curve
  - curvePoint
  syntax: 'curve_tangent(a, b, c, d, t)


    // the engine function:

    fn curve_tangent(a: f32, b: f32, c: f32, d: f32, t: f32) -> f32'
  params:
  - name: a
    type: f32
    desc: coordinate of first control point
  - name: b
    type: f32
    desc: coordinate of first point
  - name: c
    type: f32
    desc: coordinate of second point
  - name: d
    type: f32
    desc: coordinate of second control point
  - name: t
    type: f32
    desc: value between 0 and 1
  returns: f32
  uth:
  - - src/lib.rs
    - "pub fn curve_tangent(a: f32, b: f32, c: f32, d: f32, t: f32) -> f32 {\n    let m = curve_basis();\n    let tv = [3.0 * t * t, 2.0 * t, 1.0, 0.0];\n    let p = [a, b, c, d];\n    (0..4).map(|j| (0..4).map(|i| tv[i] * m[i][j]).sum::<f32>() * p[j]).sum()\n}"
