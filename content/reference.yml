- slug: bezierPoint
  name: bezierPoint()
  cat_tag: Shape / Curves
  description: Evaluates the bezier at parameter t, returning a point on the curve.
  related:
  - bezier
  - bezierTangent
  syntax: 'bezier_point(a, b, c, d, t)


    // the engine function:

    fn bezier_point(a: f32, b: f32, c: f32, d: f32, t: f32) -> f32'
  params:
  - name: a
    type: f32
    desc: coordinate of first point
  - name: b
    type: f32
    desc: coordinate of first control point
  - name: c
    type: f32
    desc: coordinate of second control point
  - name: d
    type: f32
    desc: coordinate of second point
  - name: t
    type: f32
    desc: value between 0 and 1
  returns: f32
  uth:
  - - src/lib.rs
    - "pub fn bezier_point(a: f32, b: f32, c: f32, d: f32, t: f32) -> f32 {\n    let u = 1.0 - t;\n    a * u * u * u + 3.0 * b * t * u * u + 3.0 * c * t * t * u + d * t * t * t\n}"
- slug: bezierTangent
  name: bezierTangent()
  cat_tag: Shape / Curves
  description: Calculates the tangent of a point on a bezier curve.
  related:
  - bezier
  - bezierPoint
  syntax: 'bezier_tangent(a, b, c, d, t)


    // the engine function:

    fn bezier_tangent(a: f32, b: f32, c: f32, d: f32, t: f32) -> f32'
  params:
  - name: a
    type: f32
    desc: coordinate of first point
  - name: b
    type: f32
    desc: coordinate of first control point
  - name: c
    type: f32
    desc: coordinate of second control point
  - name: d
    type: f32
    desc: coordinate of second point
  - name: t
    type: f32
    desc: value between 0 and 1
  returns: f32
  uth:
  - - src/lib.rs
    - "pub fn bezier_tangent(a: f32, b: f32, c: f32, d: f32, t: f32) -> f32 {\n    3.0 * t * t * (-a + 3.0 * b - 3.0 * c + d) + 6.0 * t * (a - 2.0 * b + c) + 3.0 * (-a + b)\n}"
