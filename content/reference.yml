entries:
- slug: PFont_class
  name: PFont
  cat_tag: Data / Composite
  description: Datatype for storing fonts. Load with loadFont() or create with createFont().
  related:
  - loadFont
  - createFont
  - textFont
  syntax: 'let font: u64 = create_font("name", size);'
  params: []
  returns: u64
  methods: []
  uth: []
- slug: PGraphics_class
  name: PGraphics
  cat_tag: Data / Composite
  description: An off-screen graphics buffer. Create with createGraphics(). Draw into it with beginDraw()/endDraw(), then display with image().
  related:
  - createGraphics
  - image
  syntax: 'let pg: u64 = create_graphics(w, h);'
  params: []
  returns: u64
  methods: []
  uth: []
- slug: PImage_class
  name: PImage
  cat_tag: Data / Composite
  description: Datatype for storing and manipulating images. Load with loadImage() or create with createImage().
  related:
  - loadImage
  - createImage
  - image
  syntax: 'let img: u64 = load_image("file.png");'
  params: []
  returns: u64
  methods:
  - sig: width(&self) -> f32
    desc: Width of the image in pixels
  - sig: height(&self) -> f32
    desc: Height of the image in pixels
  - sig: load_pixels(&self) -> Vec<u32>
    desc: Load pixel data into pixels[]
  - sig: 'update_pixels(&self, px: &[u32])'
    desc: Update image from pixels[]
  - sig: 'get(&self, x: impl Num, y: impl Num) -> Color'
    desc: Get pixel color at position
  - sig: 'set(&self, x: impl Num, y: impl Num, c: Color)'
    desc: Set pixel color at position
  - sig: 'resize(&self, w: impl Num, h: impl Num)'
    desc: Resize the image
  - sig: 'filter(&self, kind: u32, param: f32)'
    desc: Apply an image filter
  - sig: 'mask(&self, mask: u64) -> bool'
    desc: Apply an alpha mask
  uth:
  - - src/image_ext.rs
    - fn width(&self) -> f32 { crate::render::image_size(*self).0 }
  - - src/image_ext.rs
    - fn height(&self) -> f32 { crate::render::image_size(*self).1 }
  - - src/image_ext.rs
    - fn load_pixels(&self) -> Vec<u32> { crate::render::image_pixels(*self).into_iter().map(to_u32).collect() }
  - - src/image_ext.rs
    - "fn update_pixels(&self, px: &[u32]) {\n        let colors: Vec<Color> = px.iter().map(|p| from_u32(*p)).collect();\n        crate::render::image_set_pixels(*self, &colors);\n    }"
  - - src/image_ext.rs
    - 'fn get(&self, x: impl Num, y: impl Num) -> Color { crate::render::image_get(*self, x.f().floor() as i64, y.f().floor() as i64) }'
  - - src/image_ext.rs
    - 'fn set(&self, x: impl Num, y: impl Num, c: Color) { crate::render::image_set(*self, x.f().floor() as i64, y.f().floor() as i64, c) }'
- slug: PShader_class
  name: PShader
  cat_tag: Data / Composite
  description: Datatype for GLSL shaders. Load with loadShader() and apply with shader().
  related:
  - loadShader
  - shader_fn
  - resetShader
  syntax: 'let x: PShader = ...;'
  params: []
  returns: PShader
  methods:
  - sig: 'set(&self, name: &str, v: impl UniformValue)'
    desc: Set a uniform float
  - sig: 'set(&self, name: &str, v: impl UniformValue)'
    desc: Set a uniform int
  - sig: 'set(&self, name: &str, v: impl UniformValue)'
    desc: Set a uniform vec2
  - sig: 'set(&self, name: &str, v: impl UniformValue)'
    desc: Set a uniform vec3
  uth:
  - - src/shader.rs
    - "pub fn set(&self, name: &str, v: impl UniformValue) {\n        self.set_value(name, v);\n        // the shader shapes are using now takes it from the next shape on\n        #[cfg(feature = \"libprocessing\")]\n        if crate::lp::on() && *LP_ACTIVE.lock() == Some(*self) { shader(*self); }\n    }"
  - - src/shader.rs
    - "pub fn set(&self, name: &str, v: impl UniformValue) {\n        self.set_value(name, v);\n        // the shader shapes are using now takes it from the next shape on\n        #[cfg(feature = \"libprocessing\")]\n        if crate::lp::on() && *LP_ACTIVE.lock() == Some(*self) { shader(*self); }\n    }"
  - - src/shader.rs
    - "pub fn set(&self, name: &str, v: impl UniformValue) {\n        self.set_value(name, v);\n        // the shader shapes are using now takes it from the next shape on\n        #[cfg(feature = \"libprocessing\")]\n        if crate::lp::on() && *LP_ACTIVE.lock() == Some(*self) { shader(*self); }\n    }"
  - - src/shader.rs
    - "pub fn set(&self, name: &str, v: impl UniformValue) {\n        self.set_value(name, v);\n        // the shader shapes are using now takes it from the next shape on\n        #[cfg(feature = \"libprocessing\")]\n        if crate::lp::on() && *LP_ACTIVE.lock() == Some(*self) { shader(*self); }\n    }"
- slug: PShape_class
  name: PShape
  cat_tag: Data / Composite
  description: Datatype for storing shapes. Load with loadShape() or build programmatically with createShape().
  related:
  - loadShape
  - createShape
  - shape
  syntax: let s = create_shape();  // or load_shape("file.svg") for a u64 id
  params: []
  returns: PShape
  methods:
  - sig: 'get_child(&mut self, i: usize) -> Option<&mut PShape>'
    desc: Get child shape by index
  - sig: 'get_child(&mut self, i: usize) -> Option<&mut PShape>'
    desc: Get child shape by name/id
  - sig: get_child_count(&self) -> usize
    desc: Number of children
  - sig: 'get_vertex(&self, i: usize) -> (f32, f32)'
    desc: Get vertex by index as PVector
  - sig: get_vertex_count(&self) -> usize
    desc: Number of vertices
  - sig: 'set_vertex(&mut self, i: usize, x: impl Num, y: impl Num) -> &mut Self'
    desc: Set vertex position
  - sig: disable_style(&mut self) -> &mut Self
    desc: Ignore the shape's own fill/stroke
  - sig: enable_style(&mut self) -> &mut Self
    desc: Use the shape's own fill/stroke
  - sig: 'set_fill(&mut self, c: impl Paint) -> &mut Self'
    desc: Set fill color
  - sig: 'set_stroke(&mut self, c: impl Paint) -> &mut Self'
    desc: Set stroke color
  - sig: width(&self) -> f32
    desc: Bounding box width
  - sig: height(&self) -> f32
    desc: Bounding box height
  uth:
  - - src/pshape.rs
    - 'pub fn get_child(&mut self, i: usize) -> Option<&mut PShape> { self.children.get_mut(i) }'
  - - src/pshape.rs
    - 'pub fn get_child(&mut self, i: usize) -> Option<&mut PShape> { self.children.get_mut(i) }'
  - - src/pshape.rs
    - pub fn get_child_count(&self) -> usize { self.child_count() }
  - - src/pshape.rs
    - 'pub fn get_vertex(&self, i: usize) -> (f32, f32) { self.points().nth(i).unwrap_or((0.0, 0.0)) }'
  - - src/pshape.rs
    - pub fn get_vertex_count(&self) -> usize { self.vertex_count() }
  - - src/pshape.rs
    - "pub fn set_vertex(&mut self, i: usize, x: impl Num, y: impl Num) -> &mut Self {\n        let (x, y) = (x.f(), y.f());\n        let mut n = 0;\n        for s in self.steps.iter_mut() {\n            let p = match s {\n                Step::Vertex(a, b) | Step::Curve(a, b) => Some((a, b)),\n                Step::Bezier(v) => { let (l, r) = v.split_at_mut(5); Some((&mut l[4], &mut r[0])) }\n                Step::Quadratic(v) => { let (l, r) = v.split_at_mut(3); Some((&mut l[2], &mut r[0])) }\n                Step::Full(v, _) => { let (l, r) = v.split_at_mut(1); Some((&mut l[0], &mut r[0])) }\n                _ => None,\n            };\n            if let Some((a, b)) = p {\n                if n == i { *a = x; *b = y; break; }\n                n += 1;\n            }\n        }\n        self\n    }"
- slug: PVector
  name: PVector
  cat_tag: Data / Composite
  description: A class to describe a two or three dimensional vector. Commonly used to represent position, velocity, or direction.
  related: []
  syntax: let v = PVector::new(x, y);
  params: []
  returns: PVector
  methods:
  - sig: mag(&self) -> f32
    desc: Magnitude (length) of the vector
  - sig: mag_sq(&self) -> f32
    desc: Magnitude squared
  - sig: 'add(&mut self, v: &PVector) -> &mut Self'
    desc: Add another vector
  - sig: 'sub(&mut self, v: &PVector) -> &mut Self'
    desc: Subtract another vector
  - sig: 'mult(&mut self, n: f32) -> &mut Self'
    desc: Multiply by scalar
  - sig: 'div(&mut self, n: f32) -> &mut Self'
    desc: Divide by scalar
  - sig: normalize(&mut self) -> &mut Self
    desc: Normalize to unit length
  - sig: 'limit(&mut self, max: f32) -> &mut Self'
    desc: Limit the magnitude
  - sig: 'set_mag(&mut self, len: f32) -> &mut Self'
    desc: Set the magnitude
  - sig: 'dot(&self, v: &PVector) -> f32'
    desc: Dot product
  - sig: 'cross(&self, v: &PVector) -> PVector'
    desc: Cross product
  - sig: 'dist(&self, v: &PVector) -> f32'
    desc: Distance to another vector
  - sig: heading(&self) -> f32
    desc: Angle the vector makes with positive x-axis
  - sig: 'angle_between(a: &PVector, b: &PVector) -> f32'
    desc: Angle between two vectors
  - sig: 'lerp(&mut self, v: &PVector, amt: f32) -> &mut Self'
    desc: Interpolate towards another vector
  - sig: 'rotate(&mut self, angle: f32) -> &mut Self'
    desc: Rotate by an angle (2D)
  - sig: copy(&self) -> PVector
    desc: Return a copy
  uth:
  - - src/lib.rs
    - pub fn mag(&self) -> f32 { (self.x*self.x + self.y*self.y + self.z*self.z).sqrt() }
  - - src/vector.rs
    - pub fn mag_sq(&self) -> f32 { self.x * self.x + self.y * self.y + self.z * self.z }
  - - src/vector.rs
    - 'pub fn add(&mut self, v: &PVector) -> &mut Self { self.x += v.x; self.y += v.y; self.z += v.z; self }'
  - - src/vector.rs
    - 'pub fn sub(&mut self, v: &PVector) -> &mut Self { self.x -= v.x; self.y -= v.y; self.z -= v.z; self }'
  - - src/vector.rs
    - 'pub fn mult(&mut self, n: f32) -> &mut Self { self.x *= n; self.y *= n; self.z *= n; self }'
  - - src/vector.rs
    - 'pub fn div(&mut self, n: f32) -> &mut Self { self.x /= n; self.y /= n; self.z /= n; self }'
- slug: PrintWriter_class
  name: PrintWriter
  cat_tag: Data / Composite
  description: Writes text to a file. Create with createWriter(). Always call close() or flush() when done.
  related:
  - createWriter
  - saveStrings
  syntax: 'let x: PrintWriter = ...;'
  params: []
  returns: PrintWriter
  methods:
  - sig: 'print(&mut self, s: impl std::fmt::Display)'
    desc: Writes a value without a newline
  - sig: 'println(&mut self, s: impl std::fmt::Display)'
    desc: Writes a value followed by a newline
  - sig: 'println(&mut self, s: impl std::fmt::Display)'
    desc: Writes a blank line
  - sig: flush(&mut self)
    desc: Flushes the buffer to disk
  - sig: close(&mut self)
    desc: Closes the file
  uth:
  - - src/extra.rs
    - 'pub fn print(&mut self, s: impl std::fmt::Display) { if let Some(o) = &mut self.out { let _ = write!(o, "{s}"); } }'
  - - src/extra.rs
    - 'pub fn println(&mut self, s: impl std::fmt::Display) { if let Some(o) = &mut self.out { let _ = writeln!(o, "{s}"); } }'
  - - src/extra.rs
    - 'pub fn println(&mut self, s: impl std::fmt::Display) { if let Some(o) = &mut self.out { let _ = writeln!(o, "{s}"); } }'
  - - src/extra.rs
    - pub fn flush(&mut self) { if let Some(o) = &mut self.out { let _ = o.flush(); } }
  - - src/extra.rs
    - pub fn close(&mut self) { self.flush(); self.out = None; }
- slug: TableRow_class
