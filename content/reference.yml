- slug: Table_class
  name: Table
  cat_tag: Data / Composite
  description: Stores data in rows and columns like a spreadsheet. Load with loadTable(). Column names are set by the header row.
  related:
  - loadTable
  - saveTable
  - TableRow_class
  syntax: 'let x: Table = ...;'
  params: []
  returns: Table
  methods:
  - sig: 'add_column(&mut self, name: &str) -> &mut Self'
    desc: Adds a column
  - sig: add_row(&mut self) -> usize
    desc: Adds a new row, returns reference
  - sig: get_row_count(&self) -> usize
    desc: Returns number of rows
  - sig: get_column_count(&self) -> usize
    desc: Returns number of columns
  - sig: 'get_string(&self, row: usize, c: impl Col) -> String'
    desc: Gets a cell value as string
  - sig: 'get_string(&self, row: usize, c: impl Col) -> String'
    desc: Gets a cell value by column name
  - sig: 'get_int(&self, row: usize, c: impl Col) -> i32'
    desc: Gets a cell value as int
  - sig: 'get_float(&self, row: usize, c: impl Col) -> f32'
    desc: Gets a cell value as float
  - sig: 'set_string(&mut self, row: usize, c: impl Col, v: &str)'
    desc: Sets a cell value
  - sig: 'set_int(&mut self, row: usize, c: impl Col, v: i32)'
    desc: Sets a cell value as int
  - sig: 'set_float(&mut self, row: usize, c: impl Col, v: f32)'
    desc: Sets a cell value as float
  - sig: 'remove_row(&mut self, row: usize)'
    desc: Removes a row
  - sig: clear_rows(&mut self)
    desc: Removes all rows
  - sig: 'get_column_index(&self, name: &str) -> i32'
    desc: Returns index of a column by name
  uth:
  - - src/data.rs
    - "pub fn add_column(&mut self, name: &str) -> &mut Self {\n        self.columns.push(name.to_string());\n        let n = self.columns.len();\n        for r in &mut self.rows { r.resize(n, String::new()); }\n        self\n    }"
  - - src/data.rs
    - pub fn add_row(&mut self) -> usize { self.rows.push(vec![String::new(); self.columns.len()]); self.rows.len() - 1 }
  - - src/data.rs
    - pub fn get_row_count(&self) -> usize { self.row_count() }
  - - src/data.rs
    - pub fn get_column_count(&self) -> usize { self.column_count() }
  - - src/data.rs
    - "pub fn get_string(&self, row: usize, c: impl Col) -> String {\n        match self.cell(row, c) { Some(s) if !s.is_empty() => s.to_string(), _ => self.missing.string.clone() }\n    }"
  - - src/data.rs
    - "pub fn get_string(&self, row: usize, c: impl Col) -> String {\n        match self.cell(row, c) { Some(s) if !s.is_empty() => s.to_string(), _ => self.missing.string.clone() }\n    }"
