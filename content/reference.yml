- slug: loadShader
  name: loadShader()
  cat_tag: Rendering / Shaders
  description: Loads a GLSL shader from a file. Pass the fragment shader path and optionally the vertex shader path.
  related:
  - resetShader
  syntax: 'load_shader(fragPath)

    load_shader(fragPath, vertPath)


    // the engine functions behind it:

    fn load_shader(path: &str) -> PShader

    fn load_shader_vf(frag: &str, vert: &str) -> PShader'
  params:
  - name: fragPath
    type: '&str'
    desc: path to fragment shader file
  - name: vertPath
    type: '&str'
    desc: path to vertex shader file (optional)
  returns: PShader
  uth:
  - - src/shader.rs
    - "pub fn load_shader(path: &str) -> PShader {\n    let file = if std::path::Path::new(path).is_file() { path.to_string() } else { format!(\"data/{path}\") };\n    let text = match std::fs::read_to_string(&file) {\n        Ok(t) => t,\n        Err(e) => { eprintln!(\"loadShader(\\\"{path}\\\"): {e}\"); return PShader::default(); }\n    };\n    shader_from_source_named(&text, path)\n}"
  - - src/shader.rs
    - "pub fn load_shader_vf(frag: &str, vert: &str) -> PShader {\n    let s = load_shader(frag);\n    if s.id == 0 { return s; }\n    let file = if std::path::Path::new(vert).is_file() { vert.to_string() } else { format!(\"data/{vert}\") };\n    let text = match std::fs::read_to_string(&file) {\n        Ok(t) => t,\n        Err(e) => { eprintln!(\"loadShader(\\\"{vert}\\\"): {e}\"); return s; }\n    };\n    let prog = match glsl::parse(&text) { Ok(p) => p, Err(e) => { eprintln!(\"loadShader(\\\"{vert}\\\"): {e}\"); return s; } };\n    let cpu = match glsl::compile(&prog) { Ok(c) => c, Err(e) => { eprintln!(\"loadShader(\\\"{vert}\\\"): {e}\"); return s; } };\n    let mut all = shaders().lock();\n    let e = &mut all[s.id - 1];\n    attach_vertex(e, cpu, prog);\n    s\n}"
