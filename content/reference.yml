- slug: clip
  name: clip()
  cat_tag: Rendering
  description: Limits the rendering to a rectangular area. Only pixels inside the clip region will be drawn.
  related:
  - noClip
  syntax: 'clip(x, y, w, h)


    // the engine function:

    fn clip(x: impl Num, y: impl Num, w: impl Num, h: impl Num)'
  params:
  - name: x
    type: impl Num
    desc: x-coordinate
  - name: y
    type: impl Num
    desc: y-coordinate
  - name: w
    type: impl Num
    desc: width of clip region
  - name: h
    type: impl Num
    desc: height of clip region
  returns: ''
  uth:
  - - src/lib.rs
    - "pub fn clip(x: impl Num, y: impl Num, w: impl Num, h: impl Num) {\n    clip_end();\n    let (x, y, w, h) = corner_box(IMAGE_MODE.load(Ordering::Relaxed), x.f(), y.f(), w.f(), h.f());\n    let corners = [(x, y), (x + w, y), (x, y + h), (x + w, y + h)];\n    let pts: Vec<(f32, f32)> = corners.iter().map(|&(a, b)| (crate::three::screen_x(a, b, 0.0), crate::three::screen_y(a, b, 0.0))).collect();\n    let x0 = pts.iter().map(|p| p.0).fold(f32::MAX, f32::min).round() as i64;\n    let y0 = pts.iter().map(|p| p.1).fold(f32::MAX, f32::min).round() as i64;\n    let x1 = pts.iter().map(|p| p.0).fold(f32::MIN, f32::max).round() as i64;\n    let y1 = pts.iter().map(|p| p.1).fold(f32::MIN, f32::max).round() as i64;\n    *CLIP.lock() = Some(((x0, y0, x1, y1), render::copy_pixels()));\n}"
