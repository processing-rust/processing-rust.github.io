  - size
  syntax: 'box(size)

    box(w, h, d)


    // the engine functions behind it:

    fn box_cube(size: impl Num)

    fn box_3d(w: impl Num, h: impl Num, d: impl Num)'
  params:
  - name: size
    type: impl Num
    desc: dimension of the box in all directions
  - name: w
    type: impl Num
    desc: width
  - name: h
    type: impl Num
    desc: height
  - name: d
    type: impl Num
    desc: depth
  returns: ''
  uth:
  - - src/three.rs
    - 'pub fn box_cube(size: impl Num) { let s = size.f(); box_3d(s, s, s); }'
  - - src/three.rs
    - "pub fn box_3d(w: impl Num, h: impl Num, d: impl Num) {\n    #[cfg(feature = \"libprocessing\")]\n    if crate::lp::on() {\n        if crate::record::on() { record_box(w.f(), h.f(), d.f()); }\n        crate::lp::box_3d(w.f(), h.f(), d.f());\n        return;\n    }\n    let (x, y, z) = (w.f() / 2.0, h.f() / 2.0, d.f() / 2.0);\n    let v = [[-x, -y, -z], [x, -y, -z], [x, y, -z], [-x, y, -z], [-x, -y, z], [x, -y, z], [x, y, z], [-x, y, z]];\n    let t = [[0, 1, 2], [0, 2, 3], [4, 6, 5], [4, 7, 6], [0, 4, 5], [0, 5, 1],\n             [3, 2, 6], [3, 6, 7], [0, 3, 7], [0, 7, 4], [1, 5, 6], [1, 6, 2]];\n    let e = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]];\n    if crate::record::on() { record_mesh(&v, &t, &e); }\n    draw_mesh(&v, &t, Some(&e));\n}"
- slug: sphere
  name: sphere()
